nce places the school in Hue.", "reasonVi": "Câu đầu cho biết trường ở Huế."}, {"id": "r4-q2", "en": "Which floor is the library on?", "vi": "Thư viện ở tầng nào?", "options": [{"id": "o2", "en": "The ground floor", "vi": "Tầng trệt"}, {"id": "o1", "en": "The first floor", "vi": "Tầng một"}, {"id": "o0", "en": "The second floor", "vi": "Tầng hai"}], "correct": "o0", "source": 2, "reasonEn": "The library is on the second floor.", "reasonVi": "Thư viện ở tầng hai."}, {"id": "r4-q3", "en": "Where are the colourful maps?", "vi": "Những tấm bản đồ nhiều màu ở đâu?", "options": [{"id": "o1", "en": "Under the desk", "vi": "Dưới bàn"}, {"id": "o2", "en": "Above the door", "vi": "Phía trên cửa ra vào"}, {"id": "o0", "en": "Beside the board", "vi": "Bên cạnh bảng"}], "correct": "o0", "source": 4, "reasonEn": "The maps are beside the board.", "reasonVi": "Các tấm bản đồ ở bên cạnh bảng."}, {"id": "r4-q4", "en": "Where is the school bag?", "vi": "Cặp sách ở đâu?", "options": [{"id": "o1", "en": "On the chair", "vi": "Trên ghế"}, {"id": "o0", "en": "Under the desk", "vi": "Dưới bàn"}, {"id": "o2", "en": "Behind the board", "vi": "Sau bảng"}], "correct": "o0", "source": 5, "reasonEn": "The writer’s school bag is under the desk.", "reasonVi": "Cặp sách của người kể ở dưới bàn."}, {"id": "r4-q5", "en": "Whose glue stick is it?", "vi": "Thỏi hồ khô là của ai?", "options": [{"id": "o0", "en": "Lan’s", "vi": "Của Lan"}, {"id": "o1", "en": "Ben’s", "vi": "Của Ben"}, {"id": "o2", "en": "Sara’s", "vi": "Của Sara"}], "correct": "o0", "source": 6, "reasonEn": "The text says the glue stick is Lan’s.", "reasonVi": "Bài đọc cho biết thỏi hồ khô là của Lan."}]}, {"id": "r5", "title": "Our School Trip", "units": "Units 9–10", "text": "Last Saturday, my class went on a school trip to a campsite near Da Lat. The weather was cool and sunny. In the morning, we planted trees and played badminton. Then we cooked lunch together. We had rice, chicken and vegetables. In the evening, we sang songs and danced around the campfire. I was tired, but I felt happy. We all enjoyed the trip very much.", "sentences": [{"id": "r5-s01", "en": "Last Saturday, my class went on a school trip to a campsite near Da Lat.", "chunks": ["Last Saturday,", "my class went on a school trip", "to a campsite", "near Da Lat."], "start": 0.41, "end": 4.68, "vi": "Thứ Bảy tuần trước, lớp em có một chuyến đi do trường tổ chức đến một khu cắm trại gần Đà Lạt."}, {"id": "r5-s02", "en": "The weather was cool and sunny.", "chunks": ["The weather", "was cool and sunny."], "start": 4.93, "end": 6.66, "vi": "Thời tiết mát mẻ và có nắng."}, {"id": "r5-s03", "en": "In the morning, we planted trees and played badminton.", "chunks": ["In the morning,", "we planted trees", "and played badminton."], "start": 7.01, "end": 9.73, "vi": "Vào buổi sáng, chúng em trồng cây và chơi cầu lông."}, {"id": "r5-s04", "en": "Then we cooked lunch together.", "chunks": ["Then", "we cooked lunch together."], "start": 10.05, "end": 11.27, "vi": "Sau đó, chúng em cùng nhau nấu bữa trưa."}, {"id": "r5-s05", "en": "We had rice, chicken and vegetables.", "chunks": ["We had rice,", "chicken and vegetables."], "start": 11.5, "end": 13.59, "vi": "Chúng em ăn cơm, thịt gà và rau."}, {"id": "r5-s06", "en": "In the evening, we sang songs and danced around the campfire.", "chunks": ["In the evening,", "we sang songs", "and danced around the campfire."], "start": 13.98, "end": 17.03, "vi": "Vào buổi tối, chúng em hát và nhảy múa quanh đống lửa trại."}, {"id": "r5-s07", "en": "I was tired, but I felt happy.", "chunks": ["I was tired,", "but I felt happy."], "start": 17.46, "end": 19.58, "vi": "Em mệt nhưng em cảm thấy vui."}, {"id": "r5-s08", "en": "We all enjoyed the trip very much.", "chunks": ["We all enjoyed the trip", "very much."], "start": 19.86, "end": 21.74, "vi": "Tất cả chúng em đều rất thích chuyến đi."}], "vocabulary": [{"id": "r5-v1", "en": "went on a school trip", "meaning": "visited a place with our school", "kind": "Verb  need not be big if people enjoy being together.", "vi": "Không nhất thiết phải rộng nếu mọi người thích ở bên nhau."}], "correct": "o0", "source": 7, "reasonEn": "The writer values time together more than a large home.", "reasonVi": "Người kể coi trọng thời gian bên nhau hơn kích thước ngôi nhà."}]}, {"id": "r7", "title": "A Friendship Beyond the Classroom", "units": "Units 3–4 · Challenge", "text": "My friend Sara is Malaysian, and she joined our class in Hanoi two months ago. At first, she was too shy to speak in front of the class. Although she understood most instructions, she worried about making mistakes. I invited her to work with me on a poster about our free-time activities. She drew the pictures, and I helped her write short descriptions underneath. We discovered that we both enjoyed cycling, even though she preferred quiet streets and I liked busy parks. Now we meet every Sunday, and Sara is much more confident when she shares her ideas. Our friendship has taught me that listening carefully can be just as important as speaking well.", "sentences": [{"id": "r7-s01", "en": "My friend Sara is Malaysian, and she joined our class in Hanoi two months ago.", "vi": "Bạn Sara của em là người Malaysia và bạn ấy vào lớp chúng em ở Hà Nội cách đây hai tháng.", "chunks": ["My friend Sara is Malaysian,", "and she joined our class in Hanoi", "two months ago."], "start": 0, "end": 9.28}, {"id": "r7-s02", "en": "At first, she was too shy to speak in front of the class.", "vi": "Lúc đầu, bạn ấy quá ngại nên không thể nói trước lớp.", "chunks": ["At first,", "she was too shy", "to speak in front of the class."], "start": 10.15, "end": 14.82}, {"id": "r7-s03", "en": "Although she understood most instructions, she worried about making mistakes.", "vi": "Mặc dù hiểu hầu hết các hướng dẫn, bạn ấy vẫn lo mình mắc lỗi.", "chunks": ["Although she understood most instructions,", "she worried about making mistakes."], "start": 15.38, "end": 21.12}, {"id": "r7-s04", "en": "I invited her to work with me on a poster about our free-time activities.", "vi": "Em mời bạn ấy cùng làm một tấm áp phích về các hoạt động lúc rảnh rỗi của chúng em.", "chunks": ["I invited her to work with me", "on a poster", "about our free-time activities."], "start": 22.12, "end": 28.1}, {"id": "r7-s05", "en": "She drew the pictures, and I helped her write short descriptions underneath.", "vi": "Bạn ấy vẽ tranh và em giúp bạn ấy viết những đoạn mô tả ngắn bên dưới.", "chunks": ["She drew the pictures,", "and I helped her write", "short descriptions underneath."], "start": 28.69, "end": 34.34}, {"id": "r7-s06", "en": "We discovered that we both enjoyed cycling, even though she preferred quiet streets and I liked busy parks.", "vi": "Chúng em nhận ra cả hai đều thích đạp xe, dù bạn ấy thích đường phố yên tĩnh còn em thích những công viên nhộn nhịp.", "chunks": ["We discovered that we both enjoyed cycling,", "even though she preferred quiet streets", "and I liked busy parks."], "start": 35.1, "end": 43.64}, {"id": "r7-s07", "en": "Now we meet every Sunday, and Sara is much more confident when she shares her ideas.", "vi": "Bây giờ, chúng em gặp nhau vào mỗi Chủ nhật và Sara tự tin hơn nhiều khi chia sẻ ý kiến.", "chunks": ["Now we meet every Sunday,", "and Sara is much more confident", "when she shares her ideas."], "start": 44.34, "end": 51.19}, {"id": "r7-s08", "en": "Our friendship has taught me that listening carefully can be just as important as speaking well.", "vi": "Tình bạn của chúng em đã dạy em rằng lắng nghe cẩn thận có thể cũng quan trọng như nói tốt.", "chunks": ["Our friendship has taught me", "that listening carefully", "can be just as important as speaking well."], "start": 52.06, "end": 59.28}], "vocabulary": [{"id": "r7-v1", "en": "too shy to speak", "meaning": "so shy that speaking felt difficult", "meaningVi": "quá ngại nên không thể nói", "kind": "Grammar pattern", "occurrences": [{"sentence": 1, "start": 18, "end": 34}]}, {"id": "r7-v2", "en": "in front of the class", "meaning": "where all classmates can see and hear you", "meaningVi": "trước lớp", "kind": "Position phrase", "occurrences": [{"sentence": 1, "start": 35, "end": 56}]}, {"id": "r7-v3", "en": "making mistakes", "meaning": "doing or saying something incorrectly", "meaningVi": "mắc lỗi", "kind": "Verb phrase", "occurrences": [{"sentence": 2, "start": 61, "end": 76}]}, {"id": "r7-v4", "en": "work with me", "meaning": "do a task together with me", "meaningVi": "cùng làm việc với em", "kind": "Verb phrase", "occurrences": [{"sentence": 3, "start": 17, "end": 29}]}, {"id": "r7-v5", "en": "short descriptions", "meaning": "brief pieces of writing saying what something is like", "meaningVi": "những đoạn mô tả ngắn", "kind": "Noun phrase", "occurrences": [{"sentence": 4, "start": 46, "end": 64}]}, {"id": "r7-v6", "en": "much more confident", "meaning": "feeling a lot more sure of yourself", "meaningVi": "tự tin hơn nhiều", "kind": "Comparative phrase", "occurrences": [{"sentence": 6, "start": 38, "end": 57}]}, {"id": "r7-v7", "en": "shares her ideas", "meaning": "tells others what she thinks", "meaningVi": "chia sẻ ý kiến của bạn ấy", "kind": "Verb phrase", "occurrences": [{"sentence": 6, "start": 67, "end": 83}]}, {"id": "r7-v8", "en": "just as important as", "meaning": "equally important when compared with", "meaningVi": "cũng quan trọng như", "kind": "Grammar pattern", "occurrences": [{"sentence": 7, "start": 61, "end": 81}]}], "grammar": [["too + adjective + to + verb", "She was too shy to speak."], ["Although + clause", "Although she understood, she worried."], ["much + comparative", "She is much more confident."], ["has + past participle · stretch", "Our friendship has taught me something."]], "questions": ["When did Sara join your class?", "What was Sara like at first?", "Why was speaking difficult for her?", "What did you invite Sara to do?", "How did you share the work?", "What did you discover about your interests?", "How has Sara changed?", "What h stions in science lessons and read animal books in the library. The job may be difficult, but I am willing to work hard because helping an animal recover would make me proud.", "sentences": [{"id": "r8-s01", "en": "I used to think that choosing a future job was only about doing something exciting.", "vi": "Trước đây, em từng nghĩ rằng chọn nghề tương lai chỉ là tìm một công việc thú vị.", "chunks": ["I used to think", "that choosing a future job", "was only about doing something exciting."], "start": 0, "end": 5.06}, {"id": "r8-s02", "en": "However, a visit to an animal clinic in Hue changed my mind.", "vi": "Tuy nhiên, một chuyến đến phòng khám thú y ở Huế đã khiến em thay đổi suy nghĩ.", "chunks": ["However,", "a visit to an animal clinic in Hue", "changed my mind."], "start": 5.55, "end": 10.27}, {"id": "r8-s03", "en": "My grandmother’s dog had hurt its paw, so we took it to a vet who worked nearby.", "vi": "Chó của bà em bị đau ở bàn chân nên chúng em đưa nó đến một bác sĩ thú y làm việc gần đó.", "chunks": ["My grandmother’s dog had hurt its paw,", "so we took it to a vet", "who worked nearby."], "start": 10.65, "end": 16.66}, {"id": "r8-s04", "en": "The vet spoke gently to the dog and explained everything before she began.", "vi": "Bác sĩ nhẹ nhàng nói chuyện với con chó và giải thích mọi việc trước khi bắt đầu.", "chunks": ["The vet spoke gently to the dog", "and explained everything", "before she began."], "start": 17.14, "end": 22.62}, {"id": "r8-s05", "en": "I noticed that she needed patience as well as a good knowledge of science.", "vi": "Em nhận thấy bác sĩ cần sự kiên nhẫn cũng như kiến thức khoa học tốt.", "chunks": ["I noticed that she needed patience", "as well as a good knowledge", "of science."], "start": 23.2, "end": 28.65}, {"id": "r8-s06", "en": "Since that day, I have wanted to become a vet and look after animals.", "vi": "Kể từ hôm đó, em đã muốn trở thành bác sĩ thú y và chăm sóc động vật.", "chunks": ["Since that day,", "I have wanted to become a vet", "and look after animals."], "start": 28.99, "end": 35.24}, {"id": "r8-s07", "en": "At school, I ask more questions in science lessons and read animal books in the library.", "vi": "Ở trường, em đặt nhiều câu hỏi hơn trong giờ khoa học và đọc sách về động vật ở thư viện.", "chunks": ["At school,", "I ask more questions in science lessons", "and read animal books in the library."], "start": 35.88, "end": 41.96}, {"id": "r8-s08", "en": "The job may be difficult, but I am willing to work hard because helping an animal recover would make me proud.", "vi": "Công việc có thể khó, nhưng em sẵn sàng chăm chỉ vì giúp một con vật hồi phục sẽ khiến em tự hào.", "chunks": ["The job may be difficult,", "but I am willing to work hard", "because helping an animal recover would make me proud."], "start": 42.61, "end": 49.92}], "vocabulary": [{"id": "r8-v1", "en": "used to think", "meaning": "thought something regularly or believed it in the past", "meaningVi": "trước đây từng nghĩ", "kind": "Grammar pattern", "occurrences": [{"sentence": 0, "start": 2, "end": 15}]}, {"id": "r8-v2", "en": "changed my mind", "meaning": "made me think differently", "meaningVi": "khiến em thay đổi suy nghĩ", "kind": "Verb phrase", "occurrences": [{"sentence": 1, "start": 44, "end": 59}]}, {"id": "r8-v3", "en": "spoke gently", "meaning": "talked in a calm and kind way", "meaningVi": "nói chuyện nhẹ nhàng", "kind": "Verb phrase", "occurrences": [{"sentence": 3, "start": 8, "end": 20}]}, {"id": "r8-v4", "en": "patience", "meaning": "the ability to stay calm when something takes time", "meaningVi": "sự kiên nhẫn", "kind": "Word", "occurrences": [{"sentence": 4, "start": 26, "end": 34}]}, {"id": "r8-v5", "en": "as well as", "meaning": "in addition to", "meaningVi": "cũng như", "kind": "Linking phrase", "occurrences": [{"sentence": 4, "start": 35, "end": 45}]}, {"id": "r8-v6", "en": "look after animals", "meaning": "care for animals", "meaningVi": "chăm sóc động vật", "kind": "Phrasal verb phrase", "occurrences": [{"sentence": 5, "start": 50, "end": 68}]}, {"id": "r8-v7", "en": "willing to work hard", "meaning": "ready to make a strong effort", "meaningVi": "sẵn sàng làm việc chăm chỉ", "kind": "Grammar pattern", "occurrences": [{"sentence": 7, "start": 35, "end": 55}]}, {"id": "r8-v8", "en": "make me proud", "meaning": "give me a feeling of pleasure about something good I do", "meaningVi": "khiến em tự hào", "kind": "Verb phrase", "occurrences": [{"sentence": 7, "start": 96, "end": 109}]}], "grammar": [["used to + base verb · stretch", "I used to think differently."], ["who + clause", "A vet who worked nearby helped us."], ["have + past participle · stretch", "I have wanted to become a vet."], ["adjective + to + verb", "I am willing to work hard."]], "questions": ["What did you use to think about future jobs?", "What changed your mind?", "Why did you take the dog to a vet?", "How did the vet behave?", "What qualities did the vet need?", "What job would you like to do now?", "How are you learning more about animals?", "Why are you willing to work hard?"], "personal": ["What job would you like to do? Explain your reason.", "What qualities does a good teacher or doctor need?", "Tell me about someone who changed your mind about a job.", "What can you do now to prepare for your future job?"], "explanations": ["Used to + base verb describes a past belief that changed.", "However introduces a different idea.", "Who introduces information about the vet.", "Use spoke and explained for completed past actions.", "As well as adds another quality.", "Have wanted describes a wish continuing from the past.", "Use the present simple for habits at school.", "Use willing to + verb, and because to give a reason."], "audio": "audio-r08.mp3", "audioAvailable": true, "duration": 49.92, "image": "data:image/webp;base64,UklGRvSVAABXRUJQVlA4IOiVAACwugGdASqpAT0CPkkgjUSioiETyjX0KASEsrdkKgyc4xc4nHNkPrX+jRs79O4/7vnXcg9z/wz759wXzg/y+1P4//meZ/0h/6P8H7Sf+Z+0Xu1/pn+y/9vuHfsL+xful/9Hre/w/o  beans were taller than the flowers, but they also needed more water.", "vi": "Sau hai tuần, cây đậu cao hơn các cây hoa, nhưng chúng cũng cần nhiều nước hơn.", "chunks": ["After two weeks,", "the beans were taller than the flowers,", "but they also needed more water."], "start": 23.5716, "end": 28.3686}, {"id": "r9-s07", "en": "When one seedling began to bend, we moved it closer to the light instead of giving up on it.", "vi": "Khi một cây con bắt đầu nghiêng, chúng em chuyển nó đến gần ánh sáng hơn thay vì bỏ mặc nó.", "chunks": ["When one seedling began to bend,", "we moved it closer to the light", "instead of giving up on it."], "start": 28.9926, "end": 34.4448}, {"id": "r9-s08", "en": "The project taught us to notice small changes, share responsibilities and solve problems together.", "vi": "Dự án dạy chúng em quan sát những thay đổi nhỏ, chia sẻ trách nhiệm và cùng nhau giải quyết vấn đề.", "chunks": ["The project taught us", "to notice small changes,", "share responsibilities and solve problems together."], "start": 34.7178, "end": 39.624}], "vocabulary": [{"id": "r9-v1", "en": "suggested making", "meaning": "offered the idea of creating", "meaningVi": "gợi ý làm", "kind": "Grammar pattern", "occurrences": [{"sentence": 0, "start": 74, "end": 90}]}, {"id": "r9-v2", "en": "instead of buying", "meaning": "as an alternative to purchasing", "meaningVi": "thay vì mua", "kind": "Grammar pattern", "occurrences": [{"sentence": 1, "start": 0, "end": 17}]}, {"id": "r9-v3", "en": "grow indoors", "meaning": "develop inside a building", "meaningVi": "phát triển trong nhà", "kind": "Verb phrase", "occurrences": [{"sentence": 2, "start": 69, "end": 81}]}, {"id": "r9-v4", "en": "plenty of sunlight", "meaning": "a large amount of light from the sun", "meaningVi": "nhiều ánh nắng", "kind": "Noun phrase", "occurrences": [{"sentence": 3, "start": 65, "end": 83}]}, {"id": "r9-v5", "en": "recorded their height", "meaning": "wrote down how tall they were", "meaningVi": "ghi lại chi s while my friend sketched the model, so we could make a poster later. By lunchtime, the rain had stopped, and we enjoyed our packed lunches under a shelter. Although the day was different from our plans, we returned to school with new knowledge and an interesting story to tell.", "sentences": [{"id": "r10-s01", "en": "Last month, our class travelled to Ninh Binh to learn about the local rivers and countryside.", "vi": "Tháng trước, lớp em đến Ninh Bình để tìm hiểu về sông ngòi và vùng nông thôn ở đó.", "chunks": ["Last month,", "our class travelled to Ninh Binh", "to learn about the local rivers and countryside."], "start": 0, "end": 5.5}, {"id": "r10-s02", "en": "We planned to spend the morning outdoors, but heavy rain started just as our bus arrived.", "vi": "Chúng em định dành buổi sáng ở ngoài trời, nhưng mưa lớn bắt đầu ngay khi xe buýt đến nơi.", "chunks": ["We planned to spend the morning outdoors,", "but heavy rain started", "just as our bus arrived."], "start": 5.97, "end": 11.31}, {"id": "r10-s03", "en": "Some classmates felt disappointed because they were looking forward to the boat trip.", "vi": "Một số bạn thất vọng vì các bạn đã rất mong chờ chuyến đi thuyền.", "chunks": ["Some classmates felt disappointed", "because they were looking forward", "to the boat trip."], "start": 11.84, "end": 15.7}, {"id": "r10-s04", "en": "Our teacher quickly changed the plan and took us to a small museum instead.", "vi": "Cô giáo nhanh chóng đổi kế hoạch và đưa chúng em đến một bảo tàng nhỏ thay thế.", "chunks": ["Our teacher quickly changed the plan", "and took us to a small museum", "instead."], "start": 16.48, "end": 20.86}, {"id": "r10-s05", "en": "A guide showed us a model of the rivers and explained how people used the water for farming.", "vi": "Một hướng dẫn viên cho chúng em xem mô hình các con sông và giải thích cách người dân dùng nước để làm nông.", "chunks": ["A guide showed us a model of the rivers", "and explained how people used the water", "for farming."], "start": 20.86, "end": 25.78}, {"id": "r10-s06", "en": "I took notes while my friend sketched the model, so we could make a poster later.", "vi": "Em ghi chép trong khi bạn em phác họa mô hình để sau đó chúng em có thể làm một tấm áp phích.", "chunks": ["I took notes", "while my friend sketched the model,", "so we could make a poster later."], "start": 26.28, "end": 30.29}, {"id": "r10-s07", "en": "By lunchtime, the rain had stopped, and we enjoyed our packed lunches under a shelter.", "vi": "Đến giờ ăn trưa, mưa đã tạnh và chúng em ăn những phần cơm trưa mang theo dưới một mái che.", "chunks": ["By lunchtime,", "the rain had stopped,", "and we enjoyed our packed lunches under a shelter."], "start": 30.89, "end": 35.13}, {"id": "r10-s08", "en": "Although the day was different from our plans, we returned to school with new knowledge and an interesting story to tell.", "vi": "Mặc dù ngày hôm đó khác với kế hoạch, chúng em trở về trường với kiến thức mới và một câu chuyện thú vị để kể.", "chunks": ["Although the day was different from our plans,", "we returned to school", "with new knowledge and an interesting story to tell."], "start": 35.88, "end": 42.96}], "vocabulary": [{"id": "r10-v1", "en": "heavy rain", "meaning": "a lot of rain falling strongly", "meaningVi": "mưa lớn", "kind": "Noun phrase", "occurrences": [{"sentence": 1, "start": 46, "end": 56}]}, {"id": "r10-v2", "en": "felt disappointed", "meaning": "felt unhappy because something was not as hoped", "meaningVi": "cảm thấy thất vọng", "kind": "Verb phrase", "occurrences": [{"sentence": 2, "start": 16, "end": 33}]}, {"id": "r10-v3", "en": "looking forward to", "meaning": "feeling excited about a future event", "meaningVi": "mong chờ", "kind": "Phrasal verb phrase", "occurrences": [{"sentence": 2, "start": 52, "end": 70}]}, {"id": "r10-v4", "en": "changed the plan", "meaning": "decided to do something differently", "meaningVi": "thay đổi kế hoạch", "kind": "Verb phrase", "occurrences": [{"sentence": 3, "s function stopTone(){toneTicket++;for(let o of soundOscillators){try{o.stop()}catch(e){}}soundOscillators=[]}
function beep(correct){stopTone();if(!soundOn)return;let ticket=toneTicket;try{soundContext ||=new (window.AudioContext||window.webkitAudioContext)();Promise.resolve(soundContext.resume()).then(()=>{if(ticket!==toneTicket||!soundOn)return;let t=soundContext.currentTime;for(let [offset,freq,duration] of (correct?[[0,660,.12],[.11,880,.18]]:[[0,240,.22]])){let o=soundContext.createOscillator(),g=soundContext.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t+offset);g.gain.exponentialRampToValueAtTime(.08,t+offset+.012);g.gain.exponentialRampToValueAtTime(.0001,t+offset+duration);o.connect(g);g.connect(soundContext.destination);o.start(t+offset);o.stop(t+offset+duration+.02);soundOscillators.push(o)}}).catch(()=>{})}catch(e){}}
function quizView(){let d=current(),done=d.quiz.filter(q=>quizAnswers[q.id]).length,score=d.quiz.filter(q=>quizAnswers[q.id]===q.correct).length;return heading()+`<div class="modebar"><h3>WH Questions · Multiple Choice</h3><span class="count">${score} / ${d.quiz.length} correct · ${done} answered</span></div><p class="note">Choose one answer. You will see the result and a short explanation straight away.</p><div class="quiz-grid"><div class="scene-column"><div class="scene-frame"><img src="${d.image}" alt="Illustration for ${esc(d.title)}"></div><p class="scene-help">Read the story first. Look for the person, place, time or reason in each question.</p><button id="quizToReading">Go to Reading →</button></div><section aria-label="WH multiple choice questions">${d.quiz.map((q,qi)=>{let selected=quizAnswers[q.id],correct=q.options.find(o=>o.id===q.correct),chosen=q.options.find(o=>o.id===selected),ok=selected===q.correct;return `<article class="question-card"><h3><span class="q-number">${qi+1}</span>${esc(q.en)}</h3>${vn?`<p class="vi-text" lang="vi">${esc(q.vi)}</p>`:''}<div class="quiz-options">${q.options.map((o,oi)=>`<button data-quiz="${qi}:${o.id}" ${selected?'disabled':''} class="${selected?(o.id===q.correct?'right':o.id===selected?'wrong':''):''}"><span>${String.fromCharCode(65+oi)}.</span><span>${esc(o.en)}${vn?`<small lang="vi">${esc(o.vi)}</small>`:''}</span>${selected&&o.id===q.correct?'<b>✓</b>':selected&&o.id===selected?'<b>✗</b>':''}</button>`).join('')}</div>${selected?`<div class="quiz-feedback ${ok?'right':'wrong'}" role="status"><strong>${ok?'✓ Correct!':'✗ Not quite.'}</strong>${!ok?`<p>Your choice: ${esc(chosen.en)}.</p>`:''}<p><b>Correct answer: ${esc(correct.en)}.</b></p><p>${esc(q.reasonEn)}${!ok?' Your choice does not match this information.':''}</p>${vn?`<p class="vi-text" lang="vi">${ok?'Đúng!':'Chưa đúng. Bạn đã chọn: '+esc(chosen.vi)+'.'} Đáp án đúng: ${esc(correct.vi)}. ${esc(q.reasonVi)}${!ok?' Lựa chọn của bạn không phù hợp với thông tin này.':''}</p>`:''}<div class="quiz-evidence"><div class="eyebrow">One sentence from the story</div><p>${highlighted(q.source)}</p>${vn?`<p class="vi-text" lang="vi">${esc(d.sentences[q.source].vi)}</p>`:''}${d.audioAvailable?`<button data-listen="${q.source}">▶ Listen to evidence</button>`:'<span class="note">Evidence audio · coming soon</span>'}</div></div>`:''}</article>`}).join('')}<button id="resetQuiz">Reset this quiz</button></section></div>`}
function bindQuiz(){action('soundToggle',()=>{soundOn=!soundOn;stopTone();render()});action('quizToReading',()=>chooseMode('Home'));action('resetQuiz',()=>{stopAudio();stopTone();for(let q of current().quiz)delete quizAnswers[q.id];render()});document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{let [index,id]=b.dataset.quiz.split(':'),q=current().quiz[+index];if(quizAnswers[q.id])return;stopAudio();quizAnswers[q.id]=id;render();beep(id===q.correct)})}
function render(){activeSentence=-1;$('#soundToggle').textContent='SOUND · '+(soundOn?'ON':'OFF');$('#soundToggle').setAttribute('aria-pressed',String(soundOn));document.body.classList.toggle('readalong-on',follow);let d=current();$('#vnToggle').textContent='VN · '+(vn?'ON':'OFF');$('#vnToggle').classList.toggle('on',vn);$('#vnToggle').setAttribute('aria-pressed',String(vn));$('#tabs').innerHTML=['Home','Sentence','WH Quiz','Review Cards'].map(m=>`<button data-mode="${m}" class="${mode===m?'active':''}" aria-pressed="${mode===m}">${m==='Home'?'Reading':m==='Sentence'?'Practice':m}</button>`).join('');$('#lessons').innerHTML=DATA.map((x,i)=>`<button data-lesson="${i}" class="${lesson===i?'active':''}"><img src="${x.image}" alt=""><span><small>P${String(i+1).padStart(2,'0')} · ${esc(x.units)}</small>${esc(x.title)}</span></button>`).join('');$('#lessonSelect').innerHTML=DATA.map((x,i)=>`<option value="${i}" ${lesson===i?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(x.title)}</option>`).join('');$('#progress').innerHTML=allProgress();$('#main').innerHTML=mode==='Home'?home():mode==='Sentence'?sentenceView():mode==='Review Cards'?cards():quizView();bind()}
function mark(vi,status){statuses[current().vocabulary[vi].id]=status;if(mode==='Review Cards'){cardFlip=false;render()}}
function pop(vi,si,trigger){lastTrigger=trigger;const v=current().vocabulary[vi],s=current().sentences[si].en,o=v.occurrences.find(o=>o.sentence===si);if(!o)return;let source=esc(s.slice(0,o.start))+'<strong>'+esc(s.slice(o.start,o.end))+'</strong>'+esc(s.slice(o.end));let p=$('#popup');p.innerHTML=`<div class="pop-head">${sentenceButton(si)}<button id="closePop" aria-label="Close vocabulary">×</button></div><h3>${esc(v.en)}</h3><div class="eyebrow">${esc(v.kind)}</div><p class="definition">${esc(v.meaning)}</p>${vn?`<p class="vi-text" lang="vi">${esc(v.meaningVi)}</p>`:''}<div class="source">${source}${vn?`<p class="vi-text" lang="vi">${esc(current().sentences[si].vi)}</p>`:''}</div><div class="split"><button class="status-known" id="known">I know this</button><button class="status-study" id="study">Study</button></div><p class="count" id="wordStatus">${statuses[v.id]||'New word'}</p>`;p.hidden=false;let vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;p.style.maxWidth=(vw-24)+'px';let r=trigger.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.max(12,Math.min(r.left,vw-w-12))+'px';p.style.top=Math.max(12,Math.min(r.bottom+8,vh-h-12))+'px';$('#closePop').onclick=()=>closePopup(true);$('#known').onclick=()=>{mark(vi,'known');$('#wordStatus').textContent='Known'};$('#study').onclick=()=>{mark(vi,'study');$('#wordStatus').textContent='Study'};$('#closePop').focus();bindAudio()}
function action(id,f){let e=$('#'+id);if(e)e.onclick=f}
function bind(){bindPractice();bindAudio();bindQuiz();action('vnToggle',()=>{vn=!vn;closePopup();render()});document.querySelectorAll('[data-enable-vn]').forEach(b=>b.onclick=()=>{vn=true;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>chooseMode(b.dataset.mode));document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>chooseLesson(+b.dataset.lesson));$('#lessonSelect').onchange=e=>chooseLesson(+e.target.value);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>pop(+b.dataset.v,+b.dataset.s,b));action('highlightBtn',()=>{highlights=!highlights;render()});document.querySelectorAll('[data-chunk]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.chunk);render()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==+b.dataset.return);render()});action('clear',()=>{chosen=[];showAnswer=false;render()});action('reshuffle',()=>{showAnswer=false;resetChunks();render()});action('answer',()=>{showAnswer=!showAnswer;render()});action('hint',()=>{$('#feedback').textContent='Start with: '+current().sentences[sent].chunks[0]});action('check',()=>{let ok=chosen.length===current().sentences[sent].chunks.length&&chosen.every((x,i)=>x===i);$('#feedback').textContent=ok?'Well done! Your sentence matches the story.':'Try again. Check the order and include every chunk.'});for(let [id,n] of [['prevSentence',-1],['nextSentence',1]])action(id,()=>{stopAudio();sent+=n;showAnswer=false;resetChunks();render()});let f=$('#filter');if(f)f.onchange=e=>{filter=e.target.value;cardIndex=0;cardFlip=false;cardOrder=[];render()};action('flip',()=>{cardFlip=!cardFlip;render()});for(let [id,n] of [['prevCard',-1],['nextCard',1]])action(id,()=>{stopAudio();cardIndex+=n;cardFlip=false;render()});action('shuffleCards',()=>{cardOrder=shuffle(cardList());cardIndex=0;cardFlip=false;render()});action('knownCard',()=>mark(cardList()[cardIndex],'known'));action('studyCard',()=>mark(cardList()[cardIndex],'study'));action('goSentence',()=>{let id=current().sentences[current().vocabulary[cardList()[cardIndex]].occurrences[0].sentence].id;chooseMode('Home');document.getElementById(id)?.scrollIntoView({block:'center',behavior:'smooth'})});action('resetCards',()=>{for(let v of current().vocabulary)delete statuses[v.id];cardOrder=[];cardIndex=0;cardFlip=false;render()});}
document.addEventListener('pointerdown',e=>{if(!$('#popup').hidden&&!$('#popup').contains(e.target)&&!e.target.closest('[data-v]'))closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopup(true);document.querySelector('.image-dialog')?.remove()}});window.addEventListener('resize',()=>closePopup());resetChunks();render();
</script></body></html>
